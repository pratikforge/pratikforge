name: Update Cool Impasto Studio SVGs

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: update-studio
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Fetch live stats and rebuild SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python scripts/fetch_stats.py
          python scripts/build_svgs.py

      - name: Commit and push updated SVGs if changed
        run: |
          if git diff --quiet -- assets/studio-cool-dark.svg assets/studio-cool-light.svg; then
            echo "No SVG changes to commit."
            exit 0
          fi
          git config user.name "pratikforge"
          git config user.email "258086836+pratikforge@users.noreply.github.com"
          git add assets/studio-cool-dark.svg assets/studio-cool-light.svg
          git commit -m "chore: update live Cool Impasto studio SVGs [skip ci]"
          git push
